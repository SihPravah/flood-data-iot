[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pravaha-data"
version = "0.1.0"
description = "Data ingestion, normalization, temporal history, and fusion for PRAVAHA"
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests",
    "pydantic",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
test = [
    "httpx2",
    "pytest",
]
dev = [
    "httpx2",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
